import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

evaluationDependsOn(':app')

def variant = new JsonSlurper().parse(rootProject.file("../src/generated/variant.json")).variant
def mainApplicationId = variant.platform.android.applicationId.toString()
def mainApp = project(':app').android
def appIconDir = layout.buildDirectory.dir("generated/appIcon")

def copyAppIcon = tasks.register("copyAppIcon", Sync) {
    from(project(':app').file("src/main/res")) {
        include "mipmap-*/ic_launcher*", "values/ic_launcher_background.xml"
    }
    into appIconDir
}

android {
    namespace "uk.gleissner.c64commander.nextprev"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "${mainApplicationId}.nextprev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mainApp.defaultConfig.versionCode
        versionName mainApp.defaultConfig.versionName
        manifestPlaceholders = [mainApplicationId: mainApplicationId]
        resValue "string", "companion_label", "Next and Prev - ${variant.displayName}"
        resValue "string", "next_label", "Next - ${variant.displayName}"
        resValue "string", "prev_label", "Prev - ${variant.displayName}"
        buildConfigField "String", "MAIN_APPLICATION_ID", "\"${mainApplicationId}\""
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    buildTypes {
        release {
            signingConfig mainApp.signingConfigs.release
        }
    }

    sourceSets {
        main.res.srcDirs += appIconDir
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric reaches the raw file descriptor through jdk.internal.access; see :app.
            jvmArgs "--add-exports=java.base/jdk.internal.access=ALL-UNNAMED",
                    "--add-opens=java.base/java.io=ALL-UNNAMED"
        }
    }
}

tasks.named("preBuild") { dependsOn copyAppIcon }

dependencies {
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.17"
}
