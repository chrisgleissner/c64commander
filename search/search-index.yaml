# Tier 0 of the app-wide search index. Compiled by scripts/compile-search-index.mjs into
# src/generated/searchIndex.ts.
#
# See docs/plans/discoverability/spec.md section 5 for the entry contract. Two rules matter most
# when adding a row here:
#
#   1. `requires` must be honest about what has to be true for the anchor to RENDER. An entry that
#      is enabled when its anchor cannot render is a resolver timeout in front of a user.
#   2. Ids are persisted in the recently-picked list, so an id must not change between builds.
#
# `title` is the English default beside `title_key`; a translation can be added under that key
# without regenerating this file. `keywords` are English-only in this release.

version: 1

