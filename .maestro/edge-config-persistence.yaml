appId: uk.gleissner.c64commander
tags:
  - edge
  - slow
env:
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "5000"}
  TIMEOUT: ${TIMEOUT || "15000"}
  LONG_TIMEOUT: ${LONG_TIMEOUT || "20000"}
---
- runFlow: subflows/launch-and-wait.yaml
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: ${SHORT_TIMEOUT}
- assertVisible:
    id: "page-settings"
- waitForAnimationToEnd
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: feature-flag-hvsc_enabled
    checked: false
    optional: true
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: feature-flag-hvsc_enabled
    checked: false
    optional: true
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: feature-flag-hvsc_enabled
    checked: false
    optional: true

- tapOn:
    id: "tab-play"
- extendedWaitUntil:
    visible: "Play files"
    timeout: ${SHORT_TIMEOUT}
- assertVisible:
    id: "page-play"
- waitForAnimationToEnd
- swipe:
    start: 50%, 86%
    end: 50%, 38%
    duration: 400
- waitForAnimationToEnd
# The HVSC card is closed on a first visit, and it stays closed until this flow opens it — which is
# also what the second half checks: what the card remembered survives the restart. `id:` is the HTML
# id, which CollapsibleSection sets to the same string as the testid.
- scrollUntilVisible:
    element: { id: play-section-toggle-hvsc }
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- runFlow:
    when:
      notVisible:
        id: hvsc-download
    commands:
      - tapOn:
          id: play-section-toggle-hvsc
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: hvsc-download }
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: hvsc-download

- takeScreenshot: hvsc-enabled

# Restart and confirm it persisted.
- launchApp:
    stopApp: true
- runFlow: subflows/launch-and-wait.yaml
- tapOn:
    id: "tab-play"
- extendedWaitUntil:
    visible: "Play files"
    timeout: ${SHORT_TIMEOUT}
- assertVisible:
    id: "page-play"
- waitForAnimationToEnd
- swipe:
    start: 50%, 86%
    end: 50%, 38%
    duration: 400
- waitForAnimationToEnd
# The HVSC card is closed on a first visit, and it stays closed until this flow opens it — which is
# also what the second half checks: what the card remembered survives the restart. `id:` is the HTML
# id, which CollapsibleSection sets to the same string as the testid.
- scrollUntilVisible:
    element: { id: play-section-toggle-hvsc }
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- runFlow:
    when:
      notVisible:
        id: hvsc-download
    commands:
      - tapOn:
          id: play-section-toggle-hvsc
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: hvsc-download }
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: hvsc-download
- takeScreenshot: hvsc-persisted
