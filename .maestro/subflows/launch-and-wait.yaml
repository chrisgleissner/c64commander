appId: uk.gleissner.c64commander
env:
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "10000"}
  TIMEOUT: ${TIMEOUT || "30000"}
  LONG_TIMEOUT: ${LONG_TIMEOUT || "60000"}
tags:
  - subflow
---
# Press Home first to dismiss any lingering notification shade or system overlay
# that may have been left by a previous Maestro run or ANR dialog.
- pressKey: Home
- launchApp:
    stopApp: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Continue in Demo Mode"
          file: continue-demo.yaml
      - tapOn:
          text: "Continue in Demo Mode"
          optional: true
      # Startup device discovery. On a run where no device host has been configured -
      # a fresh install with no smoke-mode config file - the app scans the subnet and
      # shows DeviceDiscoveryInterstitial. That dialog is modal, so until it is
      # dismissed every tap on the tab bar is swallowed by its backdrop. Runs that
      # configure a host beforehand never see it, and the tap is optional, so it costs
      # them a warning and nothing else.
      - tapOn:
          text: "Not now"
          optional: true
      # The first-run tour. On a fresh install nothing has been recorded, so it opens over
      # Home as a full-screen overlay and swallows every tap beneath it. Optional, so a run
      # on a device that has already seen it costs a warning and nothing else.
      - tapOn:
          text: "Skip"
          optional: true
      - tapOn:
          text: "Retry connection"
          optional: true
      - tapOn:
          text: "Save & retry"
          optional: true
      - tapOn:
          text: "Done"
          optional: true
      - tapOn:
          text: "Got it"
          optional: true
      - tapOn:
          text: "Wait"
          optional: true
      - tapOn:
          text: "Close app"
          optional: true
      - tapOn:
          text: "Allow access"
          optional: true
      - tapOn:
          text: "Allow all the time"
          optional: true
      - tapOn:
          text: "Allow only while using the app"
          optional: true
      - tapOn:
          text: "Don't show again"
          optional: true
      - tapOn:
          text: "OK"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Home"
          timeout: ${LONG_TIMEOUT}
# Retry Android 16 "app compatibility" dialog dismissal because the modal can
# appear a moment after the Home tab renders and will block all WebView taps.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Don't show again"
          optional: true
      - tapOn:
          text: "OK"
          optional: true
      - waitForAnimationToEnd

# The app shell being up is not the same as the page under it having rendered. "Home"
# above is the tab bar's own label, which is rendered outside the page and stays on
# screen even when the page beneath it has been replaced by the error boundary - a
# release walkthrough once captured a crashed Home page while every assertion passed.
# Both App.tsx and PageErrorBoundary.tsx render this exact title, so one check covers a
# whole-app crash and a single-page crash. It is cheap and cannot fail unless something
# actually threw, which is why it lives here rather than in each of the flows that
# reuse this subflow.
- assertNotVisible: "Something went wrong"
# The positive half. On its own the check above is negative-only: a page that rendered
# nothing at all would satisfy it, and around thirty flows use this subflow without ever
# running common-navigation, so for those it would be the only thing standing between a
# blank page and a pass.
#
# Matched on a button Home renders, after two other approaches were tried and failed
# against this WebView:
#
#   "Firmware"          - not its own element. It exists only inside the row
#                         "App <version> Device <host> Firmware <version>", and Maestro
#                         matches a selector against an element's whole text.
#   id home-header-title - the WebView does not expose that testid. Interactive elements
#                         do surface theirs, which is why tapping tab ids works, but the
#                         page title is a plain h1 and does not.
#
# The search field, which is the first thing Home draws under the app bar. It is on screen
# at the smallest supported size and it renders in BOTH arrangements, connected or not.
#
# Two anchors were tried before it and each failed for the same reason — it was not the
# first thing on the page:
#
#   "Reboot"            a quick action further down. At 480x640, which is 320x426 CSS
#                       pixels, the quick actions are below the fold and Maestro only sees
#                       what is on screen. Three runs failed on it with nothing wrong.
#   ".*Firmware.*"      the system-information row. It was the first thing on the page
#                       until Home was reordered to lead with search; it now sits below the
#                       machine controls, and with no machine connected it drops to the app
#                       version alone and the word is not on the page at all.
#
# Matched on the field's accessible name, which is what Maestro reads from a button.
#
# Wrapped in a retry that dismisses the device picker first. The picker re-arms on its
# own - the background rediscovery timer re-probes every few seconds and a probe that
# times out puts the app back to offline and reopens it - and while it is open the page
# behind is inert, so a present element does not count as visible. A run failed exactly
# that way with the anchor plainly on screen behind the dialog.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - assertVisible: "Search the app"

# The search field is the first thing Home renders, so reaching it says the page has
# started rather than finished. The anchor this replaced - a quick action further down
# the page - was slower to appear and had been standing in for a readiness wait that was
# never written down: three iOS flows that had passed for months began failing on their
# own next assertion the moment the anchor moved up the page, on a screen where the change
# was not even needed. Waiting for the quick actions restores it explicitly.
#
# Optional, and that is the point: on the 320x426 screen this application is built for the
# quick actions are below the fold, so this waits for them where they are on screen and
# costs nothing where they are not.
- extendedWaitUntil:
    visible: "Reboot"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
