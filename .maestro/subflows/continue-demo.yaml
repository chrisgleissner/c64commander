appId: uk.gleissner.c64commander
env:
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "10000"}
tags:
  - subflow
---
- tapOn:
    text: "Continue in Demo Mode"
# The first-run tour opens once the Demo Mode offer is answered, over the whole screen.
- runFlow: dismiss-tour.yaml
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: ${SHORT_TIMEOUT}
