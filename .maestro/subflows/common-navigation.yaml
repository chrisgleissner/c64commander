appId: uk.gleissner.c64commander
env:
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "10000"}
  TIMEOUT: ${TIMEOUT || "30000"}
tags:
  - subflow
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Continue in Demo Mode"
          file: continue-demo.yaml
      - tapOn:
          text: "Continue in Demo Mode"
          optional: true
      - tapOn:
          text: "Not now"
          optional: true
      - tapOn:
          text: "Got it"
          optional: true
      - tapOn:
          text: "Wait"
          optional: true
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd
      # This wait names the tab bar's own label, which cannot distinguish a rendered
      # page from a crashed one - the tab bar renders outside the page. It is kept only
      # as a cheap readiness signal. Every navigation in this file is proved by the two
      # checks that follow it: a `page-*` id assertion and an assertNotVisible.
      #
      # Page-content anchors were tried throughout this file and only "Play files"
      # survived. Two things defeat them. Maestro matches a selector against an
      # element's whole text, and the browser merges inline spans into their containing
      # row, so "Firmware" is only ever part of "App <version> Device <host> Firmware
      # <version>". And the configuration menu's entries depend on the firmware the
      # device reports, so "Memory & ROMs" is not there in demo mode.
      #
      # SwipeNavigationLayer therefore puts an `id` on the active slot alone, named after
      # the tab on screen. Maestro matches `id:` against the HTML id attribute, so
      # `page-settings` addresses the Settings slot and no other, and it is absent when a
      # tab tap did nothing. The assertNotVisible checks cover the crashed-page case, and
      # neither check depends on page text.
      - extendedWaitUntil:
          visible:
            text: "Home"
          timeout: ${TIMEOUT}
      - assertVisible:
          id: "page-home"
      - assertNotVisible: "Something went wrong"
- retry:
    maxRetries: 3
    commands:
      # Dismissed again here, not only in launch-and-wait. The subnet scan behind
      # DeviceDiscoveryInterstitial runs for minutes on a network with no device, so the
      # dialog can appear after "Home" is already on screen and after the dismissals
      # above have run. Repeating it inside this retry is what lets a late dialog be
      # cleared and the tab tap retried, rather than all three attempts tapping into a
      # modal backdrop.
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-play"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Play files"
          timeout: ${TIMEOUT}
      # Inside the retry, not after it. The picker can re-arm between the wait above and a
      # check placed after the block, and it covers the tab bar, so the assertion then fails
      # on a tab that had already rendered. Here a late dialog costs one more attempt.
      - assertVisible: "Play files"
      - assertVisible:
          id: "page-play"
      - assertNotVisible: "Something went wrong"
- takeScreenshot: play-tab
# Settings, Config and Home are retried the same way as Play, and for the same reason:
# the device picker re-arms itself while a background scan keeps finding nothing, so it
# can cover the tab bar again between one tab and the next. Without the retry a single
# late dialog fails the whole walk on a tap that would have worked a second later.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-settings"
          optional: true
      # This wait matches the tab bar, which is present whichever tab is selected, so it
      # only says the app is up. The page id asserted below is what says the tap landed.
      - extendedWaitUntil:
          visible: "Settings"
          timeout: ${SHORT_TIMEOUT}
      # Inside the retry, not after it. The picker can re-arm between the wait above and a
      # check placed after the block, and it covers the tab bar, so the assertion then fails
      # on a tab that had already rendered. Here a late dialog costs one more attempt.
      #
      # This assertion, not the wait above, is what proves the tab tap navigated. Exactly one
      # `page-*` id is in the DOM at a time and it names the slot on screen
      # (SwipeNavigationLayer), so unlike the tab-bar label it is absent when the tap did
      # nothing and when the app is still on the previous tab.
      - assertVisible:
          id: "page-settings"
      - assertNotVisible: "Something went wrong"
- takeScreenshot: settings-tab
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-config"
          optional: true
      # This wait matches the tab bar, which is present whichever tab is selected, so it
      # only says the app is up. The page id asserted below is what says the tap landed.
      - extendedWaitUntil:
          visible: "Config"
          timeout: ${SHORT_TIMEOUT}
      # Inside the retry, not after it. The picker can re-arm between the wait above and a
      # check placed after the block, and it covers the tab bar, so the assertion then fails
      # on a tab that had already rendered. Here a late dialog costs one more attempt.
      #
      # This assertion, not the wait above, is what proves the tab tap navigated. Exactly one
      # `page-*` id is in the DOM at a time and it names the slot on screen
      # (SwipeNavigationLayer), so unlike the tab-bar label it is absent when the tap did
      # nothing and when the app is still on the previous tab.
      - assertVisible:
          id: "page-config"
      - assertNotVisible: "Something went wrong"
- takeScreenshot: config-tab
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-home"
          optional: true
      # This wait matches the tab bar, which is present whichever tab is selected, so it
      # only says the app is up. The page id asserted below is what says the tap landed.
      - extendedWaitUntil:
          visible: "Home"
          timeout: ${SHORT_TIMEOUT}
      # Inside the retry, not after it. The picker can re-arm between the wait above and a
      # check placed after the block, and it covers the tab bar, so the assertion then fails
      # on a tab that had already rendered. Here a late dialog costs one more attempt.
      #
      # This assertion, not the wait above, is what proves the tab tap navigated. Exactly one
      # `page-*` id is in the DOM at a time and it names the slot on screen
      # (SwipeNavigationLayer), so unlike the tab-bar label it is absent when the tap did
      # nothing and when the app is still on the previous tab.
      - assertVisible:
          id: "page-home"
      - assertNotVisible: "Something went wrong"
- takeScreenshot: home-tab
