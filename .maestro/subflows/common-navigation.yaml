appId: uk.gleissner.c64commander
env:
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "10000"}
  TIMEOUT: ${TIMEOUT || "30000"}
tags:
  - subflow
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Continue in Demo Mode"
          file: continue-demo.yaml
      - tapOn:
          text: "Continue in Demo Mode"
          optional: true
      - tapOn:
          text: "Not now"
          optional: true
      - tapOn:
          text: "Got it"
          optional: true
      - tapOn:
          text: "Wait"
          optional: true
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd
      # This wait names the tab bar's own label, which cannot distinguish a rendered
      # page from a crashed one - the tab bar renders outside the page. The
      # assertNotVisible below is what covers that, and it is why every navigation in
      # this file carries one.
      #
      # A page-content anchor was tried here and does not work: Maestro matches whole
      # accessibility nodes, and Chrome merges inline spans into their containing row,
      # so "Firmware" is only ever part of the node "App <version> Device <host>
      # Firmware <version>" and never matches on its own. Anchors have to be elements
      # that form their own node, which is why "Play Files" below does work.
      - extendedWaitUntil:
          visible:
            text: "Home"
          timeout: ${TIMEOUT}
      - assertNotVisible: "Something went wrong"
- retry:
    maxRetries: 3
    commands:
      # Dismissed again here, not only in launch-and-wait. The subnet scan behind
      # DeviceDiscoveryInterstitial runs for minutes on a network with no device, so the
      # dialog can appear after "Home" is already on screen and after the dismissals
      # above have run. Repeating it inside this retry is what lets a late dialog be
      # cleared and the tab tap retried, rather than all three attempts tapping into a
      # modal backdrop.
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-play"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Play Files"
          timeout: ${TIMEOUT}
- extendedWaitUntil:
    visible: "Play Files"
    timeout: ${TIMEOUT}
- assertVisible: "Play Files"
- assertNotVisible: "Something went wrong"
- takeScreenshot: play-tab
# Settings, Config and Home are retried the same way as Play, and for the same reason:
# the device picker re-arms itself while a background scan keeps finding nothing, so it
# can cover the tab bar again between one tab and the next. Without the retry a single
# late dialog fails the whole walk on a tap that would have worked a second later.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-settings"
          optional: true
      - extendedWaitUntil:
          visible: "Settings"
          timeout: ${SHORT_TIMEOUT}
- assertVisible: "Settings"
- assertNotVisible: "Something went wrong"
- takeScreenshot: settings-tab
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-config"
          optional: true
      - extendedWaitUntil:
          visible: "Memory & ROMs"
          timeout: ${SHORT_TIMEOUT}
- assertVisible: "Memory & ROMs"
- assertNotVisible: "Something went wrong"
- takeScreenshot: config-tab
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Not now"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "tab-home"
          optional: true
      - extendedWaitUntil:
          visible: "Home"
          timeout: ${SHORT_TIMEOUT}
- assertVisible: "Home"
- assertNotVisible: "Something went wrong"
- takeScreenshot: home-tab
