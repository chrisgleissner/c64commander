appId: uk.gleissner.c64commander
env:
  LONG_TIMEOUT: ${LONG_TIMEOUT || "60000"}
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "10000"}
  TIMEOUT: ${TIMEOUT || "30000"}
  STARTUP_TIMEOUT: ${STARTUP_TIMEOUT || "180000"}
tags:
  - subflow
---
# Play anchor is an alternation, not "Playlist": PlaylistPanel's title sits below the fold on
# iOS and assertVisible only counts what is on screen, so the flow failed on a correctly
# rendered page. The first two are what the page draws at the top with nothing playing —
# SidRadioChip's source caption and PlaybackControlsCard's idle title.
# Bound to production by tests/unit/maestro/iosTextAnchors.test.ts.

- runFlow: launch-and-wait.yaml
- tapOn:
    point: "25%,95%"
    optional: true
- tapOn:
    text: "Play"
    optional: true
- extendedWaitUntil:
    visible: "(Your playlist|Select a playlist item to start|Playlist)"
    timeout: ${TIMEOUT}
- assertVisible: "(Your playlist|Select a playlist item to start|Playlist)"
# WKWebView exposes aria-label ("Add items to playlist") instead of inner text
# ("Add items") in the accessibility tree, so match against the aria-label.
- scrollUntilVisible:
    element:
      text: "Add items to playlist"
    direction: DOWN
    timeout: ${TIMEOUT}
- waitForAnimationToEnd
- takeScreenshot: play-files
- retry:
    maxRetries: 3
    commands:
      - scrollUntilVisible:
          element:
            text: "Add items to playlist"
          direction: DOWN
          timeout: ${TIMEOUT}
      - tapOn:
          text: "Add items to playlist"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Choose source"
          timeout: ${TIMEOUT}
# WKWebView exposes aria-label ("Add file / folder from Local") instead of
# inner text ("Local") in the accessibility tree.  Do NOT use scrollUntilVisible
# here — scroll gestures can dismiss the sheet/dialog on iOS and hide the
# source buttons.  The buttons are always in view without scrolling.
- takeScreenshot: choose-source-dialog
- extendedWaitUntil:
    visible:
      text: "Add file / folder from Local"
    timeout: ${LONG_TIMEOUT}
- assertVisible: "Add file / folder from Local"
- takeScreenshot: choose-source
