appId: uk.gleissner.c64commander
env:
  LONG_TIMEOUT: ${LONG_TIMEOUT || "60000"}
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "10000"}
  TIMEOUT: ${TIMEOUT || "30000"}
  STARTUP_TIMEOUT: ${STARTUP_TIMEOUT || "180000"}
tags:
  - subflow
---
# Play anchor is an alternation, not "Playlist": PlaylistPanel's title sits below the fold on
# iOS and assertVisible only counts what is on screen, so the flow failed on a correctly
# rendered page. The first two are what the page draws at the top with nothing playing —
# SidRadioChip's source caption and PlaybackControlsCard's idle title.
# Bound to production by tests/unit/maestro/iosTextAnchors.test.ts.

- runFlow: launch-and-wait.yaml
- tapOn:
    point: "25%,95%"
    optional: true
- tapOn:
    text: "Play"
    optional: true
- extendedWaitUntil:
    visible: "(Your playlist|Select a playlist item to start|Playlist)"
    timeout: ${TIMEOUT}
- assertVisible: "(Your playlist|Select a playlist item to start|Playlist)"
# WKWebView exposes aria-label ("Add items to playlist") instead of inner text
# ("Add items") in the accessibility tree, so match against the aria-label.
#
# Both scrolls state visibilityPercentage rather than inheriting it. The default is also 100, so
# behaviour is unchanged, but 100 is what made ios-config-persistence fail on the full-width
# Settings rows. This button is small, is reported inside the screen, and has passed at 100 on
# every run. tests/unit/maestro/iosTextAnchors.test.ts requires the option to be stated.
- scrollUntilVisible:
    element:
      text: "Add items to playlist"
    direction: DOWN
    visibilityPercentage: 100
    timeout: ${TIMEOUT}
- waitForAnimationToEnd
- takeScreenshot: play-files
# The scroll and the tap only run while the dialog is still closed. A retry re-runs its whole
# command list, so without that condition an attempt whose trailing wait failed would scroll again
# for a button the previous attempt had already pressed and which the open dialog now covers. On
# iOS the swipe then lands on the source list underneath: run 33845624818 failed here with
# `No visible element found: "Add items to playlist"`, and its failure screenshot shows the dialog
# open on the CommoServe browser, a source neither this subflow nor its callers tap.
# "Add items" is the dialog title and is matched as one element's whole text, so it does not also
# match the "Add items to playlist" button on the page behind it.
# Bound to production by tests/unit/maestro/iosTextAnchors.test.ts.
- retry:
    maxRetries: 3
    commands:
      # An attempt only reaches this after the wait below failed, which includes the case where the
      # dialog is open on a source rather than on the interstitial. ItemSelectionDialog resets the
      # chosen source in an effect that runs when `open` becomes true, so reopening is the only way
      # back to "Choose source"; without this the retry would re-wait on a state that cannot change.
      # "Close" is the accessible name of the dialog header's close control.
      - runFlow:
          when:
            visible: "Add items"
          commands:
            - tapOn:
                text: "Close"
                optional: true
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible: "Add items"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Add items to playlist"
                direction: DOWN
                visibilityPercentage: 100
                timeout: ${TIMEOUT}
            - tapOn:
                text: "Add items to playlist"
                optional: true
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Choose source"
          timeout: ${TIMEOUT}
# WKWebView exposes aria-label ("Add file / folder from Local") instead of
# inner text ("Local") in the accessibility tree.  Do NOT use scrollUntilVisible
# here — scroll gestures can dismiss the sheet/dialog on iOS and hide the
# source buttons.  The buttons are always in view without scrolling.
- takeScreenshot: choose-source-dialog
- extendedWaitUntil:
    visible:
      text: "Add file / folder from Local"
    timeout: ${LONG_TIMEOUT}
- assertVisible: "Add file / folder from Local"
- takeScreenshot: choose-source
