appId: uk.gleissner.c64commander
tags:
  - hvsc
  - slow
  - ci-critical
env:
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "5000"}
  TIMEOUT: ${TIMEOUT || "15000"}
  LONG_TIMEOUT: ${LONG_TIMEOUT || "15000"}
---
- runFlow: subflows/launch-and-wait.yaml
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: ${SHORT_TIMEOUT}
- assertVisible:
    id: "page-settings"
- waitForAnimationToEnd
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: feature-flag-hvsc_enabled
    checked: false
    optional: true
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: feature-flag-hvsc_enabled
    checked: false
    optional: true
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: feature-flag-hvsc_enabled
    checked: false
    optional: true
- tapOn:
    id: "tab-play"
- extendedWaitUntil:
    visible: "Play files"
    timeout: ${SHORT_TIMEOUT}
- assertVisible:
    id: "page-play"
- waitForAnimationToEnd
- swipe:
    start: 50%, 86%
    end: 50%, 38%
    duration: 400
- waitForAnimationToEnd
# The HVSC card is closed on a first visit — it is a maintenance panel, and the archive is prepared
# automatically the first time a listener picks HVSC — so its controls are not in the tree until the
# card is opened. `id:` here is the HTML id, which CollapsibleSection sets to the same string as the
# testid.
- scrollUntilVisible:
    element:
      id: play-section-toggle-hvsc
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: play-section-toggle-hvsc
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hvsc-download
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: hvsc-download
- takeScreenshot: hvsc-controls
- assertVisible:
    id: hvsc-download
- assertVisible:
    id: hvsc-ingest
- takeScreenshot: hvsc-actions
- runFlow:
    when:
      visible: "Browse HVSC folders"
    file: subflows/hvsc-browse-assert.yaml
