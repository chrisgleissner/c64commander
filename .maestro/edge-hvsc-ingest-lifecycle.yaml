appId: uk.gleissner.c64commander
tags:
  - edge
  - slow
  - hvsc
  - device
env:
  LONG_TIMEOUT: ${LONG_TIMEOUT || "20000"}
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "5000"}
  TIMEOUT: ${TIMEOUT || "15000"}
---
# edge-hvsc-ingest-lifecycle: trigger a full HVSC install/ingest cycle and
# verify the progress stages transition monotonically to completion.
- runFlow: subflows/launch-and-wait.yaml

- tapOn:
    id: "tab-play"
- extendedWaitUntil:
    visible: "Play files"
    timeout: ${TIMEOUT}
- assertVisible:
    id: "page-play"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: play-section-toggle-hvsc
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: play-section-toggle-hvsc
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hvsc-download
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: hvsc-download
- extendedWaitUntil:
    visible: "Downloading"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-ingest-downloading

- extendedWaitUntil:
    visible: "Extracting"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-ingest-extracting

- extendedWaitUntil:
    visible: "Indexing"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-ingest-indexing

# Verify final ready state
- extendedWaitUntil:
    visible: "Ready"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-ingest-complete
