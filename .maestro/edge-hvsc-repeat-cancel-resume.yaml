appId: uk.gleissner.c64commander
tags:
  - edge
  - slow
  - hvsc
  - device
env:
  LONG_TIMEOUT: ${LONG_TIMEOUT || "20000"}
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "5000"}
  TIMEOUT: ${TIMEOUT || "15000"}
---
# edge-hvsc-repeat-cancel-resume: start HVSC ingest, cancel mid-extraction,
# then restart and verify the ingest reaches completion without crash.
- runFlow: subflows/launch-and-wait.yaml

- tapOn:
    id: "tab-play"
- extendedWaitUntil:
    visible: "Play files"
    timeout: ${TIMEOUT}
- assertVisible:
    id: "page-play"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: play-section-toggle-hvsc
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: play-section-toggle-hvsc
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hvsc-download
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
# Start first ingest
- tapOn:
    id: hvsc-download
- extendedWaitUntil:
    visible: "Extracting"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-repeat-extracting-first

# Cancel during extraction
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Cancelled"
    timeout: ${TIMEOUT}

- takeScreenshot: hvsc-repeat-cancelled

# Restart ingest
- tapOn:
    id: hvsc-download
- extendedWaitUntil:
    visible: "Downloading"
    timeout: ${LONG_TIMEOUT}
- extendedWaitUntil:
    visible: "Ready"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-repeat-complete
