appId: uk.gleissner.c64commander
tags:
  - edge
  - slow
  - hvsc
  - device
env:
  LONG_TIMEOUT: ${LONG_TIMEOUT || "20000"}
  SHORT_TIMEOUT: ${SHORT_TIMEOUT || "5000"}
  TIMEOUT: ${TIMEOUT || "15000"}
---
# edge-hvsc-repeat-cancel-resume: start an HVSC install, stop it during the download phase,
# then restart it and verify the install reaches the ready state without crashing.
- runFlow: subflows/launch-and-wait.yaml

- tapOn:
    id: "tab-play"
- extendedWaitUntil:
    visible: "Play files"
    timeout: ${TIMEOUT}
- assertVisible:
    id: "page-play"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: play-section-toggle-hvsc
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: play-section-toggle-hvsc
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hvsc-download
    direction: DOWN
    speed: 80
    timeout: ${LONG_TIMEOUT}
    visibilityPercentage: 50
    centerElement: true
# Start the first install. The card's status label goes "Downloading", then "Indexing", then
# "Ready" — there is no "Extracting" label, so the cancel happens during the download phase.
- tapOn:
    id: hvsc-download
- extendedWaitUntil:
    visible: "Downloading"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-repeat-downloading-first

# Stop the running install. The control is labelled "Stop", not "Cancel", and it is only in the
# tree while an install is running, so it is addressed by its id.
- tapOn:
    id: hvsc-stop
- extendedWaitUntil:
    visible: "Canceled"
    timeout: ${TIMEOUT}

- takeScreenshot: hvsc-repeat-cancelled

# Restart, and let it run to completion. Restarting clears the cancel reason.
- tapOn:
    id: hvsc-download
- extendedWaitUntil:
    visible: "Downloading"
    timeout: ${LONG_TIMEOUT}
- extendedWaitUntil:
    visible: "HVSC ready"
    timeout: ${LONG_TIMEOUT}

- takeScreenshot: hvsc-repeat-complete
