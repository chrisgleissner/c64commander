name: dependabot-rebase

# Keep open Dependabot PRs rebased on main.
#
# PR #322 failed CI for a full day purely because it was behind main: the
# AGP↔Gradle guardrail that failed it had already been fixed on main (600f3c25),
# but the PR was still being judged against the old guard. A stale PR judged
# against a since-fixed guard is indistinguishable from a real failure, which is
# how a genuinely broken dependency bump gets waved through as "flaky".
#
# Asking Dependabot to rebase re-runs CI against current main, so a red check
# means something is actually wrong.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  rebase-stale:
    name: Dependabot | Rebase stale PRs
    runs-on: ubuntu-latest

    steps:
      - name: Comment @dependabot rebase on out-of-date Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          # Whether a PR is behind is decided by comparing commits, not by
          # reading `mergeStateStatus`.
          #
          # `mergeStateStatus` reports a single winning state, and `UNSTABLE` (a
          # failing or pending check) outranks `BEHIND`. A PR that is both behind
          # and red therefore reports only `UNSTABLE`, so the previous
          # `select(.mergeStateStatus == "BEHIND")` filter skipped exactly the
          # PRs that most needed rebasing. That is self-reinforcing: one flaky
          # run turns a PR red, the red state hides that it is behind, it is
          # never rebased again, and it drifts further from main while every
          # later run judges it against a stale base. PR #330 sat in that state
          # with 37 dependency updates in it.
          #
          # `compare` answers the question directly and is unaffected by check
          # status. A PR whose head cannot be compared (deleted fork branch, for
          # example) is left alone rather than guessed at.
          prs=$(gh pr list \
            --state open \
            --app dependabot \
            --json number \
            --jq '.[].number')

          if [[ -z "${prs}" ]]; then
            echo "No open Dependabot PRs."
            exit 0
          fi

          for pr in ${prs}; do
            head_sha=$(gh pr view "${pr}" --json headRefOid --jq '.headRefOid')
            behind_by=$(gh api "repos/${GH_REPO}/compare/${BASE_REF}...${head_sha}" \
              --jq '.behind_by' 2>/dev/null || echo "")

            if [[ -z "${behind_by}" ]]; then
              echo "PR #${pr}: could not compare against ${BASE_REF}; leaving it alone."
              continue
            fi

            if [[ "${behind_by}" -eq 0 ]]; then
              echo "PR #${pr} is up to date with ${BASE_REF}."
              continue
            fi

            echo "PR #${pr} is ${behind_by} commit(s) behind ${BASE_REF}; requesting a rebase."
            gh pr comment "${pr}" --body '@dependabot rebase'
          done
