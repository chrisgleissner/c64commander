codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

# Both targets are percentages and must carry the % sign. They were `0.91`, which
# Codecov reads as 0.91% rather than 91%, so every patch passed however little of
# it was covered: PR #412 was reported at 89.94% patch coverage with a green
# check. The intent was 91%; the requirement is now 94%.
#
# The project target is 87%, one point below the whole percentage measured when
# Vitest 4 landed: it counts executable lines and branches the way istanbul does,
# which moved Codecov's figure from 94.27% to 88.51% with no change in tests.
# See AGENTS.md, "Coverage gates".
coverage:
  status:
    project:
      default:
        target: 87%
        threshold: 0%
        informational: false
        if_not_found: success
    patch:
      default:
        target: 94%
        threshold: 0%
        informational: false
        if_not_found: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "agents/tests/**"
  - "playwright/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.d.ts"
  - "**/*.config.ts"
  - "**/*.config.js"
  - "src/vite-env.d.ts"
  - "src/main.tsx"
