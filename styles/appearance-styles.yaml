# Appearance styles. Compiled by scripts/compile-styles.mjs into src/generated/appStyles.ts
# and src/generated/appStyles.css.
#
# Colours are HSL triples so they drop straight into the CSS custom properties in src/index.css.
# Every value below passes every gate in docs/plans/appearance-styles/spec.md section 9. See that
# spec for the token contract (section 5), the style catalogue (section 6) and the compile-time
# invariants (section 8) this file is checked against.

schema_version: 1

default_style: modem-grey

# "Match my device" (spec.md section 7.4): maps the Ultimate's own `Color Scheme` setting to an
# app style. The three "Commodore N" aliases map together because the firmware renders them
# identically today (research.md section 1) — a future firmware that makes them distinct is a
# data change here, not a code change.
device_scheme_map:
  Ultimate Black: vault-black
  Commodore Blue: modem-grey
  Commodore 1: modem-grey
  Commodore 2: modem-grey
  Commodore 3: modem-grey
  C128 Style: petrol-teal

