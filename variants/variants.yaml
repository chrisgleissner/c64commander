schema_version: 1

repo:
  default_variant: c64commander
  publish_defaults:
    release:
      - c64commander
      - c64u-remote
    ci:
      - c64commander
      - c64u-remote

variants:
  c64commander:
    display_name: C64 Commander
    app_id: c64commander
    description: Configure and control your Commodore 64 Ultimate over your local network.
    exported_file_basename: c64commander
    platform:
      android:
        application_id: uk.gleissner.c64commander
        custom_url_scheme: uk.gleissner.c64commander
      ios:
        bundle_id: uk.gleissner.c64commander
      web:
        short_name: C64 Commander
        theme_color: "#6C7EB7"
        background_color: "#6C7EB7"
        login_title: C64 Commander Login
        login_heading: C64 Commander
    assets:
      sources:
        icon:
          path: variants/assets/c64commander/icon.png
          format: png
        logo:
          path: variants/assets/c64commander/logo.png
          format: png
        splash:
          path: variants/assets/c64commander/splash.png
          format: png
    runtime:
      endpoints:
        device_host: c64u
        hvsc_base_url: https://hvsc.brona.dk/HVSC/
        commoserve_base_url: http://commoserve.files.commodore.net

  # C64U Remote — a focused, Android-only local remote-control variant for the
  # Commodore 64 Ultimate / C64U, targeting compact, keypad-first Android
  # devices. It declares no iOS or web platform block: no iOS or web artifacts
  # are produced for this variant.
  c64u-remote:
    publish_to_google_play: false
    display_name: C64U Remote
    app_id: c64u-remote
    description: Configure and control your Commodore 64 Ultimate over your local network.
    exported_file_basename: c64u-remote
    platform:
      android:
        application_id: uk.gleissner.c64uremote
        custom_url_scheme: uk.gleissner.c64uremote
    theme:
      theme_color: "#2F6B8B"
      background_color: "#2F6B8B"
    assets:
      sources:
        icon:
          path: variants/assets/c64u-remote/icon.png
          format: png
        logo:
          path: variants/assets/c64u-remote/logo.png
          format: png
        splash:
          path: variants/assets/c64u-remote/splash.png
          format: png
    runtime:
      endpoints:
        device_host: c64u
        hvsc_base_url: https://hvsc.brona.dk/HVSC/
        commoserve_base_url: http://commoserve.files.commodore.net
      default_display_profile: compact
      default_t9_input_enabled: true
      # Deliberately NOT overridden to `sidlite`.
      #
      # This variant targets the Commodore Callback 8020, which has not been
      # released and cannot be measured. Defaulting it to the lesser engine on
      # the strength of a spec-sheet projection would ship a real, audible
      # quality regression on every device that DOES exist, to protect one that
      # does not. reSIDfp is what makes a SID sound like a C64, and the only
      # hardware we can actually test (Pixel 4) runs it with zero underruns.
      #
      # When the 8020 exists: measure it (gate L1) and set
      # `default_sid_emulation_engine: sidlite` here if it cannot hold realtime.
      # The mechanism is in place and the user can already switch in Settings.
      # Keypad-first appliance UX: start full-screen (hide the Android status and
      # navigation bars). The user can still override both in Settings -> Display.
      default_hide_status_bar: true
      default_hide_navigation_bar: true
