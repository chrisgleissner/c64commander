schema_version: 1

repo:
  default_variant: c64commander
  publish_defaults:
    # Variants attached to a GitHub release.
    release:
      - c64commander
    # Variants built, packaged and verified on every CI run.
    ci:
      - c64commander
      - c64u-remote

variants:
  c64commander:
    display_name: C64 Commander
    app_id: c64commander
    description: Configure and control your Commodore 64 Ultimate over your local network.
    exported_file_basename: c64commander
    platform:
      android:
        application_id: uk.gleissner.c64commander
        custom_url_scheme: uk.gleissner.c64commander
      ios:
        bundle_id: uk.gleissner.c64commander
      web:
        short_name: C64 Commander
        theme_color: "#6C7EB7"
        background_color: "#6C7EB7"
        login_title: C64 Commander Login
        login_heading: C64 Commander
    assets:
      sources:
        icon:
          path: variants/assets/c64commander/icon.png
          format: png
        logo:
          path: variants/assets/c64commander/logo.png
          format: png
        splash:
          path: variants/assets/c64commander/splash.png
          format: png
    runtime:
      endpoints:
        device_host: c64u
        hvsc_base_url: https://hvsc.brona.dk/HVSC/
        commoserve_base_url: http://commoserve.files.commodore.net

  # C64U Remote — a focused, Android-only local remote-control variant for the
  # Commodore 64 Ultimate / C64U, targeting compact, keypad-first Android
  # devices. It declares no iOS or web platform block: no iOS or web artifacts
  # are produced for this variant.
  c64u-remote:
    publish_to_google_play: false
    display_name: C64U Remote
    app_id: c64u-remote
    description: Configure and control your Commodore 64 Ultimate over your local network.
    exported_file_basename: c64u-remote
    platform:
      android:
        application_id: uk.gleissner.c64uremote
        custom_url_scheme: uk.gleissner.c64uremote
        # This edition targets one keypad handset, which is 64-bit. Shipping a
        # 32-bit slice of the 7-Zip native library for it adds ~2.3 MB that no
        # supported device can load. The general edition keeps both.
        release_abis:
          - arm64-v8a
    theme:
      theme_color: "#2F6B8B"
      background_color: "#2F6B8B"
    assets:
      sources:
        icon:
          path: variants/assets/c64u-remote/icon.png
          format: png
        logo:
          path: variants/assets/c64u-remote/logo.png
          format: png
        splash:
          path: variants/assets/c64u-remote/splash.png
          format: png
    runtime:
      endpoints:
        device_host: c64u
        hvsc_base_url: https://hvsc.brona.dk/HVSC/
        commoserve_base_url: http://commoserve.files.commodore.net
      # `auto`, not `compact`. The keypad handset this variant targets has a 480x640 panel at
      # hdpi, which is 320 CSS px wide, so automatic resolution already lands on compact there -
      # the showcase recording, made at exactly that geometry, is unaffected. Pinning the profile
      # instead forced the compact presentation onto every other device running this APK: on a
      # 392 CSS px phone that meant full-screen sheets with the app bar hidden and the page behind
      # them gone, where the same phone's own width asks for the medium presentation (85dvh sheet,
      # full padding, page dimmed behind it). Screen size decides the layout; the variant does not.
      default_display_profile: auto
      default_t9_input_enabled: true
      # libSidplayEZ ("Fast & accurate"), the default of every edition. main defaulted this edition to
      # SIDLite because its handset is projected unable to render reSIDfp in real time (a Pixel 4 needs
      # 495 ms of one Cortex-A76 core per second of reSIDfp audio, and that handset's fastest cores are
      # projected 1.6-3x slower). libSidplayEZ renders the same notes natively at about 103 ms per second
      # on a Pixel 4, about 10x real time, so the same projection leaves it 3-6x real time there; and on
      # the Pixel it used a similar share of the CPU as SIDLite (10.8 s against 9.3 s for the same 50 s
      # of audio), with the accuracy of reSIDfp. Where libSidplayEZ cannot run, the engine falls back on
      # its own. Measure on the handset (gate L1) once it can be tested.
      # Keypad-first appliance UX: the compact handset this variant targets has no physical
      # navigation buttons, so hiding Android's on-screen ones there loses nothing. This default
      # only takes effect at the compact display profile — the same APK run on a phone or tablet
      # (medium/expanded profile) keeps the navigation bar, because that IS a touchscreen device
      # with real on-screen navigation. See `resolveDefaultHideNavigationBar`.
      #
      # The status bar carries the clock and is never redundant, at any profile, so no variant
      # hides it by default; see `resolveDefaultHideStatusBar`. `default_hide_status_bar` is kept
      # at `false` rather than removed so a future variant can still opt in explicitly.
      #
      # The user can override both in Settings -> Display regardless of profile.
      default_hide_status_bar: false
      default_hide_navigation_bar: true
      # The keypad handset has no touchscreen joystick to fall back on, so the
      # physical keys must be right without configuration: the four keys around
      # `8`, with `8` itself as fire. The general edition keeps classic T9.
      default_joystick_key_layout: diamond8
      # Launching a game on a keypad handset should end in the playing state
      # without a further keystroke. Off elsewhere, where a sheet opening by
      # itself would be a surprise.
      default_game_mode_on_launch: true
      # This handset has no touchscreen, so the on-screen joystick is a control
      # nobody there can reach. Game Mode gives its space to the live picture
      # from the start. Elsewhere the default waits until the app can see that
      # the player is using physical keys.
      default_game_mode_joystick: hidden
